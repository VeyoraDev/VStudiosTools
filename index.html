<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VStudios Tools</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0418 0%, #150631 30%, #2a1560 60%, #3d1578 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0418 0%, #150631 30%, #2a1560 60%, #3d1578 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }

        .loader-wrapper {
            text-align: center;
        }

        .loader-animation {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .loader-animation .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-animation .ring:nth-child(1) {
            border-top-color: #a78bfa;
            animation-delay: 0s;
        }
        .loader-animation .ring:nth-child(2) {
            border-right-color: #7c3aed;
            animation-delay: 0.2s;
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
        }
        .loader-animation .ring:nth-child(3) {
            border-bottom-color: #4c1d95;
            animation-delay: 0.4s;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
        }

        .loader-animation .pulse-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #a78bfa, #6c2bd9);
            border-radius: 50%;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .loader-text {
            margin-top: 2rem;
        }

        .loader-text .brand {
            display: block;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #6c2bd9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        .loader-text .status {
            display: block;
            color: #a78bfa;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            letter-spacing: 6px;
            opacity: 0.7;
        }

        .loader-bar {
            width: 200px;
            height: 3px;
            background: rgba(167, 139, 250, 0.1);
            border-radius: 3px;
            margin: 1.5rem auto 0;
            overflow: hidden;
        }

        .loader-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4c1d95, #a78bfa);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* ===== MAIN CONTENT ===== */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #main-content.show {
            display: block;
            opacity: 1;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 4, 24, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(167, 139, 250, 0.08);
            z-index: 1000;
            padding: 0 2rem;
            height: 60px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .nav-logo svg {
            width: 24px;
            height: 24px;
        }

        .logo-text {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* ===== BANNER ===== */
        .banner-section {
            padding: 60px 2rem 0;
            width: 100%;
        }

        .banner-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(108, 43, 217, 0.25);
            position: relative;
        }

        .banner-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .banner-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90%;
            pointer-events: none;
        }

        .banner-overlay h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 40px rgba(0,0,0,0.6);
            letter-spacing: 5px;
        }

        .banner-overlay p {
            font-size: 1.3rem;
            color: #c4b5fd;
            text-shadow: 0 2px 30px rgba(0,0,0,0.5);
            letter-spacing: 8px;
            font-weight: 300;
        }

        /* ===== TOOLS SECTION ===== */
        .tools-section {
            padding: 2rem 2rem 4rem;
            background: rgba(0, 0, 0, 0.2);
            min-height: auto;
        }

        .tools-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .tools-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .tools-header svg {
            width: 28px;
            height: 28px;
            opacity: 0.6;
        }

        .tools-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #e9d5ff;
            letter-spacing: 2px;
        }

        .tools-divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a78bfa, transparent);
            margin: 0 auto 1.5rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.1);
            border-radius: 18px;
            padding: 2rem 1.8rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(167, 139, 250, 0.05), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .tool-card:hover::before {
            opacity: 1;
        }

        .tool-card:not(.coming-soon):hover {
            transform: translateY(-6px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 20px 50px rgba(108, 43, 217, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }

        .tool-card.coming-soon {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .tool-card .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(167, 139, 250, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .tool-card:not(.coming-soon):hover .icon-box {
            background: rgba(167, 139, 250, 0.15);
            transform: scale(1.05);
        }

        .tool-card .icon-box svg {
            width: 100%;
            height: 100%;
            stroke: #a78bfa;
            fill: none;
            stroke-width: 2;
        }

        .tool-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.3rem;
        }

        .tool-card p {
            font-size: 0.85rem;
            color: #a78bfa;
            margin-bottom: 1.2rem;
            font-weight: 300;
        }

        .tool-card .btn {
            background: linear-gradient(135deg, rgba(108, 43, 217, 0.5), rgba(76, 29, 149, 0.5));
            color: white;
            border: 1px solid rgba(167, 139, 250, 0.15);
            padding: 0.6rem 2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .tool-card:not(.coming-soon):hover .btn {
            background: linear-gradient(135deg, #6C2BD9, #4C1D95);
            box-shadow: 0 8px 25px rgba(108, 43, 217, 0.3);
            transform: scale(1.02);
        }

        .tool-card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== TOOL PAGE ===== */
        .tool-page {
            display: none;
            padding: 80px 2rem 4rem;
            min-height: 100vh;
        }

        .tool-page.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tool-page-inner {
            max-width: 750px;
            margin: 0 auto;
        }

        .tool-page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
            padding: 0.5rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .back-btn:hover {
            background: rgba(167, 139, 250, 0.1);
            border-color: #a78bfa;
            color: white;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .tool-page-title {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .tool-page-sub {
            color: #a78bfa;
            font-size: 0.9rem;
            font-weight: 300;
            margin-top: 2px;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(167, 139, 250, 0.08);
            border-radius: 16px;
            padding: 1.8rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        .input-group input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: 2px solid rgba(167, 139, 250, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 30px rgba(108, 43, 217, 0.1);
        }

        .input-group input::placeholder {
            color: #6a5a8a;
        }

        .input-group .action-btn {
            padding: 0.9rem 2rem;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
            background: linear-gradient(135deg, #6C2BD9, #4C1D95);
            color: white;
        }

        .input-group .action-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(108, 43, 217, 0.3);
        }

        .input-group .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-group .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Loading inline */
        .loader-inline {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loader-inline.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .loader-inline .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(167, 139, 250, 0.08);
            border-top: 3px solid #a78bfa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }

        .loader-inline p {
            color: #a78bfa;
            font-size: 0.9rem;
        }

        /* Result */
        .result-box {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(167, 139, 250, 0.08);
            border-radius: 16px;
            padding: 1.2rem;
            margin-top: 1.5rem;
        }

        .result-box.show {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .result-box video {
            width: 100%;
            border-radius: 12px;
            background: #0a0418;
            max-height: 450px;
        }

        .result-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .result-actions .save-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .result-actions .save-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25);
        }

        .result-actions .save-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(167, 139, 250, 0.05);
            margin-top: 2rem;
        }

        .footer p {
            color: #6a5a8a;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .banner-overlay h1 {
                font-size: 2rem;
            }
            .banner-overlay p {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group .action-btn {
                justify-content: center;
            }
            .tool-page {
                padding: 75px 1rem 3rem;
            }
            .navbar {
                padding: 0 1rem;
            }
            .tools-header h2 {
                font-size: 1.4rem;
            }
            .tool-card {
                min-height: 160px;
                padding: 1.5rem;
            }
            .result-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .banner-overlay h1 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            .banner-overlay p {
                font-size: 0.7rem;
                letter-spacing: 3px;
            }
            .banner-section {
                padding: 55px 1rem 0;
            }
            .tools-section {
                padding: 1rem 1rem 3rem;
            }
            .tool-page-title {
                font-size: 1.4rem;
            }
            .loader-text .brand {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loading-screen">
        <div class="loader-wrapper">
            <div class="loader-animation">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="pulse-dot"></div>
            </div>
            <div class="loader-text">
                <span class="brand">VStudios</span>
                <span class="status">LOADING</span>
            </div>
            <div class="loader-bar">
                <div class="fill" id="loader-fill"></div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div id="main-content">

        <!-- ===== NAVBAR ===== -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <svg viewBox="0 0 24 24" stroke="#a78bfa" fill="none" stroke-width="2">
                        <use href="#icon-logo"/>
                    </svg>
                    <span class="logo-text">VStudios</span>
                </div>
                <div class="nav-links">
                    <a href="#" onclick="showHome()">Home</a>
                    <a href="#" onclick="showHome()">Tools</a>
                </div>
            </div>
        </nav>

        <!-- ===== HOME PAGE ===== -->
        <div id="home-page">

            <!-- BANNER - ATAS SEKALI -->
            <section class="banner-section">
                <div class="banner-wrapper">
                    <img src="https://files.catbox.moe/mhcy1u.jpg" alt="VStudios Tools Banner" onerror="this.style.display='none'">
                    <div class="banner-overlay">
                        <h1>VStudios Tools</h1>
                        <p>By Veyora</p>
                    </div>
                </div>
            </section>

            <!-- TOOLS - TERUS BAWAH BANNER -->
            <section class="tools-section">
                <div class="tools-container">
                    <div class="tools-header">
                        <svg viewBox="0 0 24 24" stroke="#a78bfa" fill="none" stroke-width="2">
                            <use href="#icon-tools"/>
                        </svg>
                        <h2>Our Tools</h2>
                    </div>
                    <div class="tools-divider"></div>

                    <div class="tools-grid">
                        <!-- TikTok Downloader -->
                        <div class="tool-card" onclick="openTool('tiktok')">
                            <div class="icon-box">
                                <svg viewBox="0 0 24 24">
                                    <use href="#icon-tiktok"/>
                                </svg>
                            </div>
                            <h3>TikTok Downloader</h3>
                            <p>Download videos without watermark</p>
                            <button class="btn">Open Tool</button>
                        </div>

                        <!-- Instagram Coming Soon -->
                        <div class="tool-card coming-soon">
                            <div class="icon-box">
                                <svg viewBox="0 0 24 24">
                                    <use href="#icon-instagram"/>
                                </svg>
                            </div>
                            <h3>Instagram Downloader</h3>
                            <p>Coming Soon</p>
                            <button class="btn" disabled>Soon</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- ===== TOOL PAGE: TIKTOK ===== -->
        <div id="tool-tiktok" class="tool-page">
            <div class="tool-page-inner">
                <div class="tool-page-header">
                    <button class="back-btn" onclick="showHome()">
                        <svg viewBox="0 0 24 24">
                            <use href="#icon-back"/>
                        </svg>
                        Back
                    </button>
                    <div>
                        <div class="tool-page-title">TikTok Downloader</div>
                        <div class="tool-page-sub">Paste link & download video without watermark</div>
                    </div>
                </div>

                <div class="input-box">
                    <div class="input-group">
                        <input type="text" id="tiktok-url" placeholder="Paste TikTok link here... e.g. https://vt.tiktok.com/xxx">
                        <button id="download-btn" class="action-btn">
                            <svg viewBox="0 0 24 24">
                                <use href="#icon-download"/>
                            </svg>
                            Download
                        </button>
                    </div>
                </div>

                <div id="loader-inline" class="loader-inline">
                    <div class="spinner"></div>
                    <p>Processing video...</p>
                </div>

                <div id="result-box" class="result-box">
                    <video id="result-video" controls></video>
                    <div class="result-actions">
                        <button id="save-video-btn" class="save-btn">
                            <svg viewBox="0 0 24 24">
                                <use href="#icon-download"/>
                            </svg>
                            Download Video
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>© 2026 VStudios Tools &bull; Developed By Veyora</p>
        </footer>
    </div>

    <script>
        // ===== LOADING SCREEN WITH PROGRESS =====
        document.addEventListener('DOMContentLoaded', function() {
            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');
            const loaderFill = document.getElementById('loader-fill');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 100) progress = 100;
                loaderFill.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                }
            }, 200);

            setTimeout(function() {
                loadingScreen.style.opacity = '0';
                setTimeout(function() {
                    loadingScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                    void mainContent.offsetWidth;
                    mainContent.className = 'show';
                }, 600);
            }, 2800);
        });

        // ===== NAVIGATION =====
        function showHome() {
            document.getElementById('home-page').style.display = 'block';
            const toolPage = document.getElementById('tool-tiktok');
            toolPage.classList.remove('active');
            toolPage.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            resetTool();
        }

        function openTool(tool) {
            if (tool === 'tiktok') {
                document.getElementById('home-page').style.display = 'none';
                const toolPage = document.getElementById('tool-tiktok');
                toolPage.style.display = 'block';
                setTimeout(() => toolPage.classList.add('active'), 10);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                resetTool();
            }
        }

        // ===== TIKTOK DOWNLOADER =====
        const urlInput = document.getElementById('tiktok-url');
        const downloadBtn = document.getElementById('download-btn');
        const loaderInline = document.getElementById('loader-inline');
        const resultBox = document.getElementById('result-box');
        const videoElement = document.getElementById('result-video');
        const saveBtn = document.getElementById('save-video-btn');

        function resetTool() {
            resultBox.classList.remove('show');
            resultBox.style.display = 'none';
            loaderInline.classList.remove('show');
            loaderInline.style.display = 'none';
            videoElement.src = '';
            urlInput.value = '';
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <use href="#icon-download"/>
                </svg>
                Download
            `;
        }

        // Enter key support
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                downloadBtn.click();
            }
        });

        // ===== EXTRACT VIDEO URL FROM API RESPONSE =====
        function extractVideoUrl(data) {
            // If data is string, return it
            if (typeof data === 'string') {
                return data;
            }
            
            // If data is object, search recursively
            if (typeof data === 'object' && data !== null) {
                // Common keys for video URLs
                const keys = ['video', 'url', 'download', 'play', 'no_watermark', 'watermark', 'hd', 'sd', 'source'];
                
                for (const key of keys) {
                    if (data[key]) {
                        if (typeof data[key] === 'string') {
                            return data[key];
                        }
                        // If nested object, search deeper
                        const nested = extractVideoUrl(data[key]);
                        if (nested) return nested;
                    }
                }
                
                // Search all values recursively
                for (const value of Object.values(data)) {
                    if (typeof value === 'string' && (value.includes('http') || value.includes('.mp4'))) {
                        return value;
                    }
                    if (typeof value === 'object') {
                        const found = extractVideoUrl(value);
                        if (found) return found;
                    }
                }
            }
            
            return null;
        }

        // ===== DOWNLOAD BUTTON CLICK =====
        downloadBtn.addEventListener('click', async function() {
            const url = urlInput.value.trim();
            
            if (!url) {
                alert('Please paste a TikTok link first!');
                return;
            }

            if (!url.includes('tiktok.com') && !url.includes('vt.tiktok.com')) {
                alert('Please enter a valid TikTok link!');
                return;
            }

            // Show loading
            loaderInline.style.display = 'block';
            setTimeout(() => loaderInline.classList.add('show'), 10);
            resultBox.classList.remove('show');
            resultBox.style.display = 'none';
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = `
                <svg viewBox="0 0 24 24" style="animation: spin 0.7s linear infinite;">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="40 20"/>
                </svg>
                Processing...
            `;

            try {
                const encodedUrl = encodeURIComponent(url);
                const apiUrl = `https://api-faa.my.id/faa/tiktok?url=${encodedUrl}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                console.log('API Response:', data); // Debug: lihat response di console

                // Extract video URL from response
                let videoUrl = null;
                
                if (data.status && data.result) {
                    videoUrl = extractVideoUrl(data.result);
                } else if (data.data) {
                    videoUrl = extractVideoUrl(data.data);
                } else if (data.video) {
                    videoUrl = data.video;
                } else {
                    // Try whole response
                    videoUrl = extractVideoUrl(data);
                }

                if (videoUrl) {
                    // Hide loading, show result
                    loaderInline.classList.remove('show');
                    loaderInline.style.display = 'none';
                    
                    resultBox.style.display = 'block';
                    setTimeout(() => resultBox.classList.add('show'), 10);
                    
                    // Set video source
                    videoElement.src = videoUrl;
                    videoElement.load();
                    
                    // Setup download button
                    saveBtn.onclick = function(e) {
                        e.preventDefault();
                        downloadVideo(videoUrl);
                    };
                } else {
                    alert('Failed to get video URL. Please try another link.\nCheck console for API response.');
                    console.log('Could not extract video from:', data);
                    loaderInline.classList.remove('show');
                    loaderInline.style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
                loaderInline.classList.remove('show');
                loaderInline.style.display = 'none';
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <use href="#icon-download"/>
                    </svg>
                    Download
                `;
            }
        });

        // ===== DOWNLOAD VIDEO FUNCTION =====
        function downloadVideo(videoUrl) {
            // Method 1: Fetch as blob
            fetch(videoUrl, {
                mode: 'cors',
                headers: {
                    'Accept': 'video/mp4,video/*'
                }
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tiktok_video_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => window.URL.revokeObjectURL(url), 5000);
            })
            .catch((error) => {
                console.error('Download error:', error);
                // Method 2: Fallback - open in new tab
                window.open(videoUrl, '_blank');
            });
        }

        // ===== SPIN ANIMATION =====
        const style = document.createElement("style");
        style.textContent = `
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        console.log('VStudios Tools loaded successfully!');
        console.log('Developed By Veyora');
        console.log('API will be called when you paste a TikTok link and click Download.');
    </script>
</body>
</html>
