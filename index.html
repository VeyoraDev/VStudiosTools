<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VStudios Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #060210;
            color: #f0ebff;
            min-height: 100vh;
            overflow-x: hidden;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #060210; }
        ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.15); border-radius: 4px; }

        /* ===== LOADING ===== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060210;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loader-wrapper { text-align: center; }

        .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto;
        }

        .loader-ring .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: ringSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-ring .ring:nth-child(1) {
            border-top-color: #a78bfa;
            animation-delay: 0s;
        }
        .loader-ring .ring:nth-child(2) {
            border-right-color: #7c3aed;
            animation-delay: 0.2s;
            width: 75%;
            height: 75%;
            top: 12.5%;
            left: 12.5%;
        }
        .loader-ring .ring:nth-child(3) {
            border-bottom-color: #4c1d95;
            animation-delay: 0.4s;
            width: 50%;
            height: 50%;
            top: 25%;
            left: 25%;
        }

        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-ring .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #a78bfa, #6c2bd9);
            border-radius: 50%;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .loader-text .brand {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #6c2bd9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            margin-top: 2rem;
        }

        .loader-text .brand::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.2), transparent);
            margin: 0.8rem auto 0;
        }

        .loader-text .status {
            display: block;
            color: #3a2a5a;
            font-size: 0.65rem;
            margin-top: 0.8rem;
            letter-spacing: 10px;
            font-weight: 200;
        }

        /* ===== MAIN CONTENT ===== */
        #main-content { display: none; opacity: 0; transition: opacity 0.8s ease; }
        #main-content.show { display: block; opacity: 1; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(6, 2, 16, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(167, 139, 250, 0.04);
            z-index: 1000;
            padding: 0 2rem;
            height: 54px;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .nav-logo svg { width: 20px; height: 20px; }
        .logo-text {
            background: linear-gradient(135deg, #c4b5fd, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
        }

        .nav-links a {
            color: #4a3a6a;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            transition: color 0.4s ease;
            letter-spacing: 0.8px;
        }

        .nav-links a:hover { color: #a78bfa; }

        /* ===== BANNER ===== */
        .banner-section {
            padding: 54px 2rem 0;
            width: 100%;
        }

        .banner-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(76, 29, 149, 0.08);
            position: relative;
            background: #0a0518;
        }

        .banner-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.85;
            transition: opacity 0.4s ease;
        }

        .banner-wrapper:hover img { opacity: 1; }

        .banner-overlay {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90%;
            pointer-events: none;
        }

        .banner-overlay h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 40px rgba(0,0,0,0.6);
            letter-spacing: 6px;
        }

        .banner-overlay p {
            font-size: 1rem;
            color: #a78bfa;
            text-shadow: 0 2px 30px rgba(0,0,0,0.5);
            letter-spacing: 12px;
            font-weight: 300;
        }

        /* ===== BANNER BAWAH ===== */
        .banner-bottom {
            max-width: 1100px;
            margin: 0.8rem auto 0;
            display: flex;
            gap: 0.8rem;
            padding: 0 2rem;
            flex-wrap: wrap;
        }

        .banner-bottom .telegram-box {
            flex: 1;
            min-width: 180px;
            background: rgba(0, 136, 204, 0.06);
            border: 1px solid rgba(0, 136, 204, 0.08);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            color: #f0ebff;
        }

        .banner-bottom .telegram-box:hover {
            background: rgba(0, 136, 204, 0.1);
            border-color: rgba(0, 136, 204, 0.15);
        }

        .banner-bottom .telegram-box svg {
            width: 24px;
            height: 24px;
        }

        .banner-bottom .telegram-box .label {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #6a8aaa;
        }

        .banner-bottom .telegram-box .label strong {
            color: #4a9aca;
            font-weight: 500;
        }

        .banner-bottom .request-box {
            flex: 1;
            min-width: 180px;
            background: rgba(167, 139, 250, 0.03);
            border: 1px solid rgba(167, 139, 250, 0.04);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .banner-bottom .request-box:hover {
            background: rgba(167, 139, 250, 0.06);
            border-color: rgba(167, 139, 250, 0.08);
        }

        .banner-bottom .request-box svg {
            width: 20px;
            height: 20px;
            stroke: #a78bfa;
            fill: none;
            stroke-width: 1.8;
        }

        .banner-bottom .request-box .label {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #6a5a8a;
        }

        /* ===== TOOLS SECTION ===== */
        .tools-section {
            padding: 1.5rem 2rem 3rem;
            background: rgba(0, 0, 0, 0.15);
        }

        .tools-container { max-width: 1100px; margin: 0 auto; }

        .tools-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tools-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tools-header-left svg { width: 22px; height: 22px; opacity: 0.3; }
        .tools-header-left h2 {
            font-size: 1.3rem;
            font-weight: 300;
            color: #a78bfa;
            letter-spacing: 4px;
        }

        .tools-header-left .total-badge {
            font-size: 0.65rem;
            color: #5a4a7a;
            background: rgba(167, 139, 250, 0.04);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(167, 139, 250, 0.04);
            letter-spacing: 0.5px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(167, 139, 250, 0.04);
            border-radius: 10px;
            padding: 0.3rem 0.8rem;
        }

        .search-box input {
            background: none;
            border: none;
            color: #f0ebff;
            font-size: 0.75rem;
            padding: 0.4rem 0;
            width: 140px;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            outline: none;
        }

        .search-box input::placeholder { color: #3a2a5a; }
        .search-box svg { width: 16px; height: 16px; stroke: #4a3a6a; fill: none; stroke-width: 2; }

        .tools-divider {
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.15), transparent);
            margin: 0 auto 1.5rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.04);
            border-radius: 14px;
            padding: 1.2rem 1rem;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tool-card.hidden { display: none; }

        .tool-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% -20%, rgba(167, 139, 250, 0.03), transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .tool-card:hover::after { opacity: 1; }

        .tool-card:not(.coming-soon):hover {
            transform: translateY(-3px);
            border-color: rgba(167, 139, 250, 0.08);
            box-shadow: 0 20px 60px rgba(76, 29, 149, 0.04);
            background: rgba(255, 255, 255, 0.025);
        }

        .tool-card .icon-box {
            width: 40px;
            height: 40px;
            background: rgba(167, 139, 250, 0.03);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.5s ease;
            border: 1px solid rgba(167, 139, 250, 0.03);
        }

        .tool-card:not(.coming-soon):hover .icon-box {
            background: rgba(167, 139, 250, 0.06);
            transform: scale(1.05);
            border-color: rgba(167, 139, 250, 0.06);
        }

        .tool-card .icon-box svg {
            width: 100%;
            height: 100%;
            stroke: #a78bfa;
            fill: none;
            stroke-width: 1.8;
        }

        .tool-card h3 {
            font-size: 0.8rem;
            font-weight: 500;
            color: #f0ebff;
            margin-bottom: 0.1rem;
            letter-spacing: -0.2px;
        }

        .tool-card p {
            font-size: 0.6rem;
            color: #5a4a7a;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ===== TOOL PAGE ===== */
        .tool-page {
            display: none;
            padding: 74px 2rem 4rem;
            min-height: 100vh;
        }

        .tool-page.active {
            display: block;
            animation: fadeSlide 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tool-page-inner { max-width: 700px; margin: 0 auto; }

        .tool-page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(167, 139, 250, 0.04);
            color: #5a4a7a;
            padding: 0.45rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            background: rgba(167, 139, 250, 0.04);
            border-color: rgba(167, 139, 250, 0.06);
            color: #a78bfa;
            transform: translateX(-2px);
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            transition: transform 0.4s ease;
        }

        .back-btn:hover svg { transform: translateX(-3px); }

        .tool-page-title {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .tool-page-sub {
            color: #5a4a7a;
            font-size: 0.8rem;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(167, 139, 250, 0.03);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 0.8rem;
        }

        .input-group input, .input-group textarea {
            flex: 1;
            padding: 0.75rem 1.2rem;
            border: 1px solid rgba(167, 139, 250, 0.04);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.015);
            color: #f0ebff;
            font-size: 0.85rem;
            transition: all 0.4s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.08);
            box-shadow: 0 0 40px rgba(76, 29, 149, 0.02);
        }

        .input-group input::placeholder, .input-group textarea::placeholder {
            color: #2a1a4a;
            font-weight: 300;
            font-size: 0.8rem;
        }

        .input-group .action-btn {
            padding: 0.75rem 1.6rem;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
            background: rgba(108, 43, 217, 0.06);
            color: #8a7aaa;
            border: 1px solid rgba(167, 139, 250, 0.04);
            font-family: 'Inter', sans-serif;
        }

        .input-group .action-btn:hover:not(:disabled) {
            background: rgba(108, 43, 217, 0.1);
            border-color: rgba(167, 139, 250, 0.06);
            color: #a78bfa;
        }

        .input-group .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .input-group .action-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .loader-inline {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loader-inline.show {
            display: block;
            animation: fadeSlide 0.4s ease;
        }

        .loader-inline .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(167, 139, 250, 0.04);
            border-top: 2px solid rgba(167, 139, 250, 0.3);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loader-inline p {
            color: #4a3a6a;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* ===== RESULT BOX ===== */
        .result-box {
            display: none;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(167, 139, 250, 0.03);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .result-box.show {
            display: block;
            animation: fadeSlide 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ===== VIDEO WRAPPER ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #04010e;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
            max-height: 420px;
        }

        .video-wrapper .cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }

        .video-wrapper .cover-img.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-wrapper .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 54px;
            height: 54px;
            background: rgba(108, 43, 217, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .video-wrapper .play-overlay:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(108, 43, 217, 0.3);
        }

        .video-wrapper .play-overlay svg {
            width: 22px;
            height: 22px;
            fill: rgba(255, 255, 255, 0.7);
            margin-left: 3px;
        }

        .video-wrapper .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .video-info {
            padding: 0.8rem 0.3rem 0.3rem;
        }

        .video-info .title {
            font-size: 0.85rem;
            font-weight: 400;
            color: #f0ebff;
            line-height: 1.5;
            margin-bottom: 0.4rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.2px;
        }

        .video-info .stats {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            font-size: 0.65rem;
            color: #5a4a7a;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .video-info .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-info .stats .stat-icon {
            opacity: 0.3;
            width: 12px;
            height: 12px;
        }

        .video-info .author {
            color: #3a2a5a;
            font-size: 0.7rem;
            margin-top: 0.3rem;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .result-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .result-actions .save-btn {
            flex: 1;
            min-width: 120px;
            padding: 0.65rem;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: rgba(16, 185, 129, 0.04);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.04);
            font-family: 'Inter', sans-serif;
        }

        .result-actions .save-btn:hover:not(:disabled) {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.06);
        }

        .result-actions .save-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .result-actions .save-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ===== IMAGE GRID ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .image-grid .img-item {
            border-radius: 8px;
            overflow: hidden;
            background: #0a0518;
            border: 1px solid rgba(167, 139, 250, 0.04);
            transition: all 0.4s ease;
            position: relative;
        }

        .image-grid .img-item:hover {
            border-color: rgba(167, 139, 250, 0.08);
            transform: scale(1.02);
        }

        .image-grid .img-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-grid .img-item .img-actions {
            padding: 0.4rem;
            display: flex;
            gap: 0.4rem;
            justify-content: center;
        }

        .image-grid .img-item .img-actions .save-btn-sm {
            padding: 0.2rem 0.6rem;
            border: none;
            border-radius: 6px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(16, 185, 129, 0.06);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.04);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .image-grid .img-item .img-actions .save-btn-sm:hover {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.06);
        }

        .image-grid .img-item .img-actions .save-btn-sm svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ===== YOUTUBE RESULT ===== */
        .yt-result {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            padding: 0.3rem;
        }

        .yt-result .thumbnail {
            width: 120px;
            min-width: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0518;
        }

        .yt-result .thumbnail img {
            width: 100%;
            display: block;
        }

        .yt-result .info {
            flex: 1;
        }

        .yt-result .info .title {
            font-size: 0.9rem;
            font-weight: 400;
            color: #f0ebff;
            line-height: 1.4;
            margin-bottom: 0.3rem;
        }

        .yt-result .info .duration {
            font-size: 0.7rem;
            color: #5a4a7a;
            margin-bottom: 0.5rem;
        }

        .yt-result .info .format-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(167, 139, 250, 0.06);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.04);
            margin-top: 0.3rem;
        }

        /* ===== ART NAMA ===== */
        .arti-result {
            padding: 0.5rem 0.3rem;
        }

        .arti-result .nama-display {
            font-size: 2rem;
            font-weight: 600;
            color: #c4b5fd;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .arti-result .arti-text {
            font-size: 0.85rem;
            line-height: 1.8;
            color: #c4b5fd;
            font-weight: 300;
            white-space: pre-wrap;
            background: rgba(167, 139, 250, 0.02);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(167, 139, 250, 0.03);
        }

        .arti-result .catatan {
            font-size: 0.7rem;
            color: #5a4a7a;
            margin-top: 0.8rem;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(16, 185, 129, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(16, 185, 129, 0.04);
            border-radius: 10px;
            padding: 0.7rem 2rem;
            color: #34d399;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: 'Inter', sans-serif;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #toast svg {
            width: 16px;
            height: 16px;
            stroke: #34d399;
            fill: none;
            stroke-width: 2.5;
        }

        /* ===== REQUEST MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 2, 16, 0.85);
            backdrop-filter: blur(12px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: #0a0518;
            border: 1px solid rgba(167, 139, 250, 0.06);
            border-radius: 16px;
            padding: 2rem;
            max-width: 450px;
            width: 90%;
            animation: fadeSlide 0.4s ease;
        }

        .modal-box h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #f0ebff;
        }

        .modal-box p {
            font-size: 0.8rem;
            color: #5a4a7a;
            margin-bottom: 1.2rem;
        }

        .modal-box .input-group {
            flex-direction: column;
        }

        .modal-box .input-group textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.8rem;
            border: 1px solid rgba(167, 139, 250, 0.04);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.015);
            color: #f0ebff;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            resize: vertical;
        }

        .modal-box .input-group textarea:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.08);
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .modal-box .modal-actions button {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Inter', sans-serif;
        }

        .modal-box .modal-actions .send-btn {
            background: rgba(0, 136, 204, 0.06);
            color: #4a9aca;
            border: 1px solid rgba(0, 136, 204, 0.04);
        }

        .modal-box .modal-actions .send-btn:hover {
            background: rgba(0, 136, 204, 0.1);
            border-color: rgba(0, 136, 204, 0.08);
        }

        .modal-box .modal-actions .cancel-btn {
            background: rgba(255, 255, 255, 0.02);
            color: #5a4a7a;
            border: 1px solid rgba(167, 139, 250, 0.04);
        }

        .modal-box .modal-actions .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0, 0, 0, 0.15);
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid rgba(167, 139, 250, 0.02);
            margin-top: 2rem;
        }

        .footer p {
            color: #2a1a4a;
            font-size: 0.65rem;
            letter-spacing: 4px;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .banner-overlay h1 { font-size: 1.8rem; letter-spacing: 3px; }
            .banner-overlay p { font-size: 0.8rem; letter-spacing: 6px; }
            .tools-grid { grid-template-columns: 1fr; gap: 0.6rem; }
            .input-group { flex-direction: column; }
            .input-group .action-btn { justify-content: center; }
            .tool-page { padding: 68px 1rem 3rem; }
            .navbar { padding: 0 1rem; height: 48px; }
            .tools-header { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            .tool-card { min-height: 110px; padding: 1rem 0.8rem; }
            .result-actions { flex-direction: column; }
            .video-info .stats { gap: 0.5rem; font-size: 0.6rem; }
            #toast { padding: 0.6rem 1.2rem; font-size: 0.75rem; bottom: 1.2rem; }
            .yt-result { flex-direction: column; align-items: center; }
            .yt-result .thumbnail { width: 100%; max-width: 200px; min-width: unset; }
            .banner-bottom { flex-direction: column; padding: 0 1rem; }
            .image-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
            .image-grid .img-item img { height: 120px; }
            .modal-box { padding: 1.5rem; }
        }

        @media (max-width: 480px) {
            .banner-overlay h1 { font-size: 1.3rem; letter-spacing: 2px; }
            .banner-overlay p { font-size: 0.65rem; letter-spacing: 4px; }
            .banner-section { padding: 48px 1rem 0; }
            .tools-section { padding: 0.8rem 1rem 3rem; }
            .tool-page-title { font-size: 1.2rem; }
            .loader-text .brand { font-size: 1.6rem; letter-spacing: 5px; }
            .video-wrapper .play-overlay { width: 44px; height: 44px; }
            .video-wrapper .play-overlay svg { width: 18px; height: 18px; }
            .tool-card .icon-box { width: 34px; height: 34px; padding: 6px; }
            .tool-card h3 { font-size: 0.7rem; }
            .image-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .image-grid .img-item img { height: 100px; }
        }

            { id: 'artinama', name: 'Arti Nama', desc: 'Discover the meaning of your name', icon: 'icon-user', category: 'tools' },
            { id: 'superhd', name: 'Photo HD', desc: 'Enhance photo to HD quality', icon: 'icon-hd', category: 'image' },
            { id: 'brat', name: 'BRAT Text2Image', desc: 'Create BRAT style text image', icon: 'icon-brat', category: 'image' },
            { id: 'bratvid', name: 'BRAT Text2Video', desc: 'Create BRAT style video', icon: 'icon-video', category: 'video' },
            { id: 'pinterest', name: 'Pinterest Search', desc: 'Search Pinterest images', icon: 'icon-pinterest', category: 'image' },
            { id: 'qrcreate', name: 'QR Create', desc: 'Generate QR code from text', icon: 'icon-qr', category: 'tools' },
            { id: 'qrdetect', name: 'QR Detect', desc: 'Read QR code from image', icon: 'icon-qr', category: 'tools' },
            { id: 'loli', name: 'Random Loli', desc: 'Get random anime loli image', icon: 'icon-random', category: 'image' },
            { id: 'meme', name: 'Random Meme', desc: 'Get random meme image', icon: 'icon-meme', category: 'image' },
            { id: 'pap', name: 'Random Pap', desc: 'Get random pap image', icon: 'icon-random', category: 'image' },
            { id: 'waifu', name: 'Random Waifu', desc: 'Get random waifu image', icon: 'icon-random', category: 'image' },
            { id: 'memegen', name: 'Meme Generator', desc: 'Create custom meme with text', icon: 'icon-meme', category: 'image' },
            { id: 'tiktoksearch', name: 'TikTok Search', desc: 'Search TikTok videos', icon: 'icon-tiktok', category: 'search' },
        ];

        // ============================================================
        // ===== GENERATE TOOL CARDS =====
        // ============================================================
        function generateToolCards() {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = '';
            toolsData.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.dataset.tool = tool.id;
                card.dataset.name = tool.name.toLowerCase();
                card.dataset.category = tool.category;
                card.onclick = () => openTool(tool.id);
                card.innerHTML = `
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24"><use href="#${tool.icon}"/></svg>
                    </div>
                    <h3>${tool.name}</h3>
                    <p>${tool.desc}</p>
                    <button class="btn">Open</button>
                `;
                grid.appendChild(card);
            });
            document.getElementById('total-tools').textContent = toolsData.length + ' Tools';
        }

        // ============================================================
        // ===== SEARCH TOOLS =====
        // ============================================================
        function filterTools(query) {
            const q = query.toLowerCase().trim();
            const cards = document.querySelectorAll('.tool-card');
            cards.forEach(card => {
                const name = card.dataset.name || '';
                const match = name.includes(q);
                card.classList.toggle('hidden', !match);
            });
        }

        // ============================================================
        // ===== LOADING =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            generateToolCards();
            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');

            setTimeout(function() {
                loadingScreen.style.opacity = '0';
                setTimeout(function() {
                    loadingScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                    void mainContent.offsetWidth;
                    mainContent.className = 'show';
                }, 600);
            }, 2800);
        });

        // ============================================================
        // ===== NAVIGATION =====
        // ============================================================
        function showHome() {
            document.getElementById('home-page').style.display = 'block';
            // Hide all tool pages
            document.querySelectorAll('.tool-page').forEach(p => {
                p.classList.remove('active');
                p.style.display = 'none';
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openTool(toolId) {
            document.getElementById('home-page').style.display = 'none';
            
            // Check if page exists, if not create it
            let page = document.getElementById('tool-' + toolId);
            if (!page) {
                page = createToolPage(toolId);
            }
            
            page.style.display = 'block';
            setTimeout(() => page.classList.add('active'), 10);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // ===== CREATE TOOL PAGE =====
        // ============================================================
        function createToolPage(toolId) {
            const tool = toolsData.find(t => t.id === toolId);
            if (!tool) return null;

            const page = document.createElement('div');
            page.id = 'tool-' + toolId;
            page.className = 'tool-page';
            page.style.display = 'none';

            // Build page based on tool type
            let content = '';
            
            if (toolId === 'tiktok') {
                content = buildTikTokPage();
            } else if (toolId === 'instagram') {
                content = buildInstagramPage();
            } else if (toolId === 'ytmp4') {
                content = buildYtmp4Page();
            } else if (toolId === 'ytmp3') {
                content = buildYtmp3Page();
            } else if (toolId === 'artinama') {
                content = buildArtiNamaPage();
            } else if (toolId === 'superhd') {
                content = buildSuperHDPage();
            } else if (toolId === 'brat') {
                content = buildBratPage('brat', 'BRAT Text2Image', 'Enter text for BRAT image');
            } else if (toolId === 'bratvid') {
                content = buildBratPage('bratvid', 'BRAT Text2Video', 'Enter text for BRAT video');
            } else if (toolId === 'pinterest') {
                content = buildPinterestPage();
            } else if (toolId === 'qrcreate') {
                content = buildQrCreatePage();
            } else if (toolId === 'qrdetect') {
                content = buildQrDetectPage();
            } else if (['loli', 'meme', 'pap', 'waifu'].includes(toolId)) {
                content = buildRandomImagePage(toolId);
            } else if (toolId === 'memegen') {
                content = buildMemeGenPage();
            } else if (toolId === 'tiktoksearch') {
                content = buildTikTokSearchPage();
            } else {
                content = buildGenericPage(tool);
            }

            page.innerHTML = content;
            document.getElementById('main-content').appendChild(page);
            
            // Initialize tool specific JS after page is added
            setTimeout(() => initToolPage(toolId), 100);
            
            return page;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatNumber(num) {
            if (!num) return '0';
            if (typeof num === 'string') {
                const cleaned = num.replace(/[^0-9.]/g, '');
                if (num.includes('K')) return num;
                if (num.includes('M')) return num;
                return cleaned || '0';
            }
            num = parseInt(num);
            if (isNaN(num)) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function setupVideoPlayer(coverId, playId, videoId) {
            const cover = document.getElementById(coverId);
            const play = document.getElementById(playId);
            const video = document.getElementById(videoId);
            if (!cover || !play || !video) return;

            function showCover() {
                cover.classList.remove('hidden');
                play.classList.remove('hidden');
            }
            function hideCover() {
                cover.classList.add('hidden');
                play.classList.add('hidden');
            }

            play.addEventListener('click', () => { video.play(); hideCover(); });
            video.addEventListener('play', hideCover);
            video.addEventListener('pause', () => { if (video.currentTime === 0) showCover(); });
            video.addEventListener('ended', showCover);
        }

        function downloadFile(url, filename, buttonId, toastMsg = 'Download successful!') {
            const btn = document.getElementById(buttonId);
            if (!btn) return;
            btn.textContent = 'Downloading...';
            btn.disabled = true;

            fetch(url, { mode: 'cors' })
                .then(r => { if (!r.ok) throw new Error('Network error'); return r.blob(); })
                .then(blob => {
                    const urlBlob = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = urlBlob;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => window.URL.revokeObjectURL(urlBlob), 5000);
                    showToast(toastMsg);
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><use href="#icon-download"/></svg> Download`;
                    btn.disabled = false;
                })
                .catch(() => {
                    window.open(url, '_blank');
                    showToast('Download started in new tab');
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><use href="#icon-download"/></svg> Download`;
                    btn.disabled = false;
                });
        }

                if (e.key === 'Enter') document.getElementById('tiktok-download-btn').click();
            });

            document.getElementById('tiktok-download-btn').addEventListener('click', async function() {
                const url = document.getElementById('tiktok-url').value.trim();
                if (!url) { showToast('Please paste a TikTok link first!'); return; }
                if (!url.includes('tiktok.com') && !url.includes('vt.tiktok.com')) {
                    showToast('Please enter a valid TikTok link!');
                    return;
                }

                const loader = document.getElementById('tiktok-loader');
                const result = document.getElementById('tiktok-result');
                const btn = this;
                
                loader.style.display = 'block';
                setTimeout(() => loader.classList.add('show'), 10);
                result.classList.remove('show');
                result.style.display = 'none';
                btn.disabled = true;
                btn.innerHTML = `<svg viewBox="0 0 24 24" style="animation: spin 0.7s linear infinite;"><circle cx="12" cy="12" r="10" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="40 20"/></svg> Processing...`;

                try {
                    const apiUrl = `https://api-faa.my.id/faa/tiktok?url=${encodeURIComponent(url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data.status && data.result) {
                        const r = data.result;
                        let videoUrl = r.alternatives?.hd || r.data || r.alternatives?.selected || null;
                        const coverUrl = r.cover || null;
                        const title = r.title || 'No title';
                        const author = r.author?.nickname || r.author?.username || 'Unknown';
                        const stats = r.stats || {};

                        if (videoUrl) {
                            loader.classList.remove('show');
                            loader.style.display = 'none';
                            result.style.display = 'block';
                            setTimeout(() => result.classList.add('show'), 10);

                            document.getElementById('tiktok-comments').textContent = formatNumber(stats.comment);
                            document.getElementById('tiktok-shares').textContent = formatNumber(stats.share);
                            document.getElementById('tiktok-duration').textContent = r.duration || '-';

                            document.getElementById('tiktok-save').onclick = () => downloadFile(videoUrl, `tiktok_video_${Date.now()}.mp4`, 'tiktok-save');

                        showToast('Failed to process video');
                        loader.classList.remove('show');
                        loader.style.display = 'none';
                    }
                } catch (e) {
                    console.error(e);
                    showToast('An error occurred');
                    loader.classList.remove('show');
                    loader.style.display = 'none';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><use href="#icon-download"/></svg> Download`;

                                                <button onclick="downloadFile('${videoUrl}', 'tiktok_search_${Date.now()}_${index}.mp4', null, 'Video downloaded!')" style="padding:0.2rem 0.8rem;border:none;border-radius:6px;font-size:0.6rem;cursor:pointer;background:rgba(16,185,129,0.06);color:#34d399;border:1px solid rgba(16,185,129,0.04);font-family:'Inter',sans-serif;display:flex;align-items:center;gap:0.3rem;">
                                                    <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;"><use href="#icon-download"/></svg> Download
                                                </button>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                            grid.appendChild(item);
                        });
                    } else {
                        showToast('No results found');
                        loader.classList.remove('show');
                        loader.style.display = 'none';
                    }
                } catch (e) {
                    console.error(e);
                    showToast('An error occurred');
                    loader.classList.remove('show');
                    loader.style.display = 'none';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<svg viewBox="0 0 24 24"><use href="#icon-search"/></svg> Search`;
                }
            });
        }
